<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Каталог отзывов{% endblock %}</title>
</head>
<body>

    <header>
        <h1>Каталог отзывов</h1>
        <nav>
            <form action="{{ url_for('index') }}" method="GET" style="display: inline;">
                <button type="submit">Главная</button>
            </form>
            <form action="{{ url_for('add_review') }}" method="GET" style="display: inline;">
                <button type="submit">Оставить отзыв</button>
            </form>
            <form action="{{ url_for('stats') }}" method="GET" style="display: inline;">
                <button type="submit">Статистика</button>
            </form>
        </nav>
    </header>

    <hr>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
