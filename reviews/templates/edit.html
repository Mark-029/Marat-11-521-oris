{% extends "base.html" %}

{% block title %}
Редактировать отзыв
{% endblock %}

{% block content %}

<h2>Редактирование отзыва</h2>

{% for error in errors|default([]) %}
    <p style="color: red;">{{ error }}</p>
{% endfor %}

<form method="POST">

    <p>
        <label>Имя пользователя</label><br>
        <input type="text" name="username" value="{{ username }}">
    </p>

    <p>
        <label>Оценка (1-5)</label><br>
        <input type="number" name="rating" min="1" max="5" value="{{ rating }}">
    </p>

    <p>
        <label>Комментарий</label><br>
        <textarea name="comment">{{ comment }}</textarea>
    </p>

    <button type="submit">Сохранить изменения</button>

</form>

<br>
<form action="{{ url_for('detail', review_id=review.id) }}" method="GET" style="display: inline;">
    <button type="submit">Отмена</button>
</form>

{% endblock %}
