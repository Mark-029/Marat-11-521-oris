{% extends "base.html" %}

{% block title %}
Оставить отзыв
{% endblock %}

{% block content %}

<h2>Новый отзыв</h2>

{% for error in errors|default([]) %}
    <p>{{ error }}</p>
{% endfor %}

<form method="POST">

    <p>
        <label>Имя пользователя</label><br>
        <input type="text" name="username" value="{{ username|default('') }}">
    </p>

    <p>
        <label>Оценка (1-5)</label><br>
        <input type="number" name="rating" value="{{ rating|default('') }}">
    </p>

    <p>
        <label>Комментарий</label><br>
        <textarea name="comment">{{ comment|default('') }}</textarea>
    </p>

    <button type="submit">Сохранить</button>

</form>

{% endblock %}
