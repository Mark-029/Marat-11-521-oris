{% extends "base.html" %}

{% block title %}
Отзыв от {{ review.username }}
{% endblock %}

{% block content %}

<h2>Отзыв от пользователя: {{ review.username }}</h2>
<p>Оценка: {{ review.rating }}/5</p>
<p>Комментарий: {{ review.comment }}</p>

<div>
    <form action="{{ url_for('edit_review', review_id=review.id) }}" method="GET" style="display: inline;">
        <button type="submit">Редактировать</button>
    </form>

    <form action="{{ url_for('delete_review', review_id=review.id) }}" method="POST" style="display: inline;">
        <button type="submit" onclick="return confirm('Вы уверены, что хотите удалить этот отзыв?');">Удалить</button>
    </form>

    <form action="{{ url_for('index') }}" method="GET" style="display: inline;">
        <button type="submit">Назад</button>
    </form>
</div>

{% endblock %}
